<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flask Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f9f9f9;
        }
        header {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            margin: 0.3rem;
            border: none;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border-radius: 3px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 5px;
            box-shadow: 0 0 10px #ccc;
        }
        .input-field {
            width: 100%;
            padding: 0.6rem;
            margin: 0.5rem 0 1rem 0;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .error {
            color: red;
            margin-bottom: 1rem;
        }
        .btn-logout {
            background-color: #dc3545;
        }
        .btn-logout:hover {
            background-color: #b02a37;
        }
    </style>
</head>
<body>
    <header>Subscribe to Code With Blaise</header>

    {% block body %}
    {% endblock %}
</body>
</html>
